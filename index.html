<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24160d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bookshelf">
  <title>My Bookshelf</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="images/bookcase.webp" as="image">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>My Bookshelf</h1>
      <p class="stats" id="stats"></p>
    </div>
    <div class="topbar-actions">
      <button id="menuBtn" class="icon-btn" aria-label="More options" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <button id="addBtn" class="btn btn-primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add book
      </button>
    </div>
    <div id="menu" class="menu" role="menu" hidden>
      <button role="menuitem" data-action="stats">Year in review</button>
      <button role="menuitem" data-action="sync">Sync across devices<small id="syncNote"></small></button>
      <button role="menuitem" data-action="export">Export backup<small id="backupNote"></small></button>
      <button role="menuitem" data-action="import">Import backup</button>
      <button role="menuitem" data-action="sounds" id="soundsItem">Sounds: on</button>
    </div>
  </header>

  <main id="library">
    <div class="banner" id="backupBanner" hidden>
      <p>It’s been a while since you backed up your library. Your books only live on this device.</p>
      <div class="banner-actions">
        <button class="btn btn-small btn-primary" data-banner="backup">Back up now</button>
        <button class="btn btn-small btn-ghost" data-banner="sync">Set up sync</button>
        <button class="btn btn-small btn-ghost" data-banner="later">Later</button>
      </div>
    </div>
    <div class="searchbar">
      <label class="search">
        <span class="visually-hidden">Search your books</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input type="search" id="searchInput" placeholder="Search titles, authors, genres" autocomplete="off">
      </label>
      <button class="btn btn-small" id="arrangeBtn" aria-pressed="false">Arrange</button>
    </div>
    <p class="arrange-hint" id="arrangeHint" hidden>Drag books to reorder them on their shelf, then tap Done.</p>
    <div class="controls">
      <div class="chips" id="genreChips" role="group" aria-label="Filter read books by genre"></div>
      <label class="sort">
        <span class="visually-hidden">Sort read books by</span>
        <select id="sortSel">
          <option value="finished">Recently finished</option>
          <option value="custom">My order</option>
          <option value="rating">Highest rated</option>
          <option value="title">Title</option>
          <option value="author">Author</option>
          <option value="genre">Genre</option>
        </select>
      </label>
    </div>
    <div class="bookcase" id="bookcase"></div>
  </main>

  <input type="file" id="importInput" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
