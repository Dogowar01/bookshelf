<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24160d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bookshelf">
  <title>My Bookshelf</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>My Bookshelf</h1>
      <p class="stats" id="stats"></p>
    </div>
    <div class="topbar-actions">
      <button id="menuBtn" class="icon-btn" aria-label="More options" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <button id="addBtn" class="btn btn-primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add book
      </button>
    </div>
    <div id="menu" class="menu" role="menu" hidden>
      <button role="menuitem" data-action="export">Export backup</button>
      <button role="menuitem" data-action="import">Import backup</button>
    </div>
  </header>

  <main id="library">
    <section class="case" aria-labelledby="readingHead">
      <div class="case-head">
        <h2 id="readingHead">Currently reading</h2>
        <span class="count" id="readingCount"></span>
      </div>
      <div class="shelves" id="readingShelves"></div>
    </section>

    <section class="case" aria-labelledby="readHead">
      <div class="case-head">
        <h2 id="readHead">Read</h2>
        <span class="count" id="readCount"></span>
        <label class="sort">
          <span class="visually-hidden">Sort by</span>
          <select id="sortSel">
            <option value="finished">Recently finished</option>
            <option value="rating">Highest rated</option>
            <option value="title">Title</option>
            <option value="author">Author</option>
            <option value="genre">Genre</option>
          </select>
        </label>
      </div>
      <div class="chips" id="genreChips" role="group" aria-label="Filter by genre"></div>
      <div class="shelves" id="readShelves"></div>
    </section>
  </main>

  <input type="file" id="importInput" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
